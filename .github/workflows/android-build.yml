name: Build APK
on:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Clean and Scaffold Android
        run: |
          # Destroy existing android cache to force a pristine plugin registry
          rm -rf android
          flutter clean
          flutter create --platforms=android .
          flutter pub get
          
      - name: Create Proguard Rules
        run: |
          cat << 'PROGUARD' > android/app/proguard-rules.pro
          -keep class io.flutter.plugins.** { *; }
          -keep class com.mr.flutter.plugin.filepicker.** { *; }
          -keep class com.arthenica.ffmpegkit.** { *; }
          -dontwarn com.arthenica.ffmpegkit.**
          PROGUARD

      - name: Inject Configurations via Python
        run: |
          python3 -c "
          import os
          
          # 1. Update AndroidManifest.xml (Permissions safely injected before application tag)
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r') as f: m = f.read()
              perms = '    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" />\n    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" />\n    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n    <uses-permission android:name=\"android.permission.INTERNET\" />\n'
              if 'RECORD_AUDIO' not in m:
                  m = m.replace('<application', perms + '    <application')
                  with open(manifest_path, 'w') as f: f.write(m)

          # 2. Update settings.gradle.kts or settings.gradle (FFMPEG Repo)
          settings_kts = 'android/settings.gradle.kts'
          settings_groovy = 'android/settings.gradle'
          if os.path.exists(settings_kts):
              with open(settings_kts, 'r') as f: s = f.read()
              if 'ffmpeg-kit' not in s:
                  s = s.replace('mavenCentral()', 'mavenCentral()\n        maven(\"https://raw.githubusercontent.com/DucLQ92/ffmpeg-kit-audio/main\")')
                  with open(settings_kts, 'w') as f: f.write(s)
          elif os.path.exists(settings_groovy):
              with open(settings_groovy, 'r') as f: s = f.read()
              if 'ffmpeg-kit' not in s:
                  s = s.replace('mavenCentral()', 'mavenCentral()\n        maven { url \"https://raw.githubusercontent.com/DucLQ92/ffmpeg-kit-audio/main\" }')
                  with open(settings_groovy, 'w') as f: f.write(s)

          # 3. Update build.gradle.kts or build.gradle (Hard-disable Minify & Link Proguard)
          build_kts = 'android/app/build.gradle.kts'
          build_groovy = 'android/app/build.gradle'
          if os.path.exists(build_kts):
              with open(build_kts, 'r') as f: b = f.read()
              b = b.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
              if 'proguardFiles' not in b:
                  b = b.replace('release {', 'release {\n            isMinifyEnabled = false\n            isShrinkResources = false\n            proguardFiles(getDefaultProguardFile(\"proguard-android-optimize.txt\"), \"proguard-rules.pro\")')
              with open(build_kts, 'w') as f: f.write(b)
          elif os.path.exists(build_groovy):
              with open(build_groovy, 'r') as f: b = f.read()
              b = b.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 24')
              if 'proguardFiles' not in b:
                  b = b.replace('release {', 'release {\n            minifyEnabled false\n            shrinkResources false\n            proguardFiles getDefaultProguardFile(\"proguard-android-optimize.txt\"), \"proguard-rules.pro\"')
              with open(build_groovy, 'w') as f: f.write(b)
          "

      - name: Build APK
        run: flutter build apk --release --no-shrink
        
      - uses: actions/upload-artifact@v4
        with:
          name: Dub-App-APK
          path: build/app/outputs/flutter-apk/app-release.apk
