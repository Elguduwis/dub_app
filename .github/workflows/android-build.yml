name: Build APK
on:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      # FIX: Get dependencies FIRST so Android knows the plugins exist!
      - name: Get Dependencies
        run: flutter pub get
        
      - name: Inject Android Permissions & FFmpeg Mirror
        run: |
          sed -i '/<manifest /a \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle.kts || true
          sed -i '/mavenCentral()/a \        maven { url "https://raw.githubusercontent.com/DucLQ92/ffmpeg-kit-audio/main" }' android/build.gradle || true
          sed -i '/mavenCentral()/a \        maven("https://raw.githubusercontent.com/DucLQ92/ffmpeg-kit-audio/main")' android/build.gradle.kts || true
          
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Dub-App-APK
          path: build/app/outputs/flutter-apk/app-release.apk
