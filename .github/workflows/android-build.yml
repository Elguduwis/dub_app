name: Build Kaida Dub
on:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Clean and Scaffold Android
        run: |
          rm -rf android
          flutter clean
          flutter create --org com.kainuwa --project-name dubapp --platforms=android .
          flutter pub get
          
      - name: Generate Kaida Dub Icons
        run: dart run flutter_launcher_icons

      - name: Create Proguard Rules (Crucial for App Shrinking)
        run: |
          cat << 'PROGUARD' > android/app/proguard-rules.pro
          -keep class io.flutter.plugins.** { *; }
          -keep class com.mr.flutter.plugin.filepicker.** { *; }
          -keep class com.arthenica.ffmpegkit.** { *; }
          -dontwarn com.arthenica.ffmpegkit.**
          PROGUARD

      - name: Inject Configurations via Python
        run: |
          python3 -c "
          import os
          import re
          
          # 1. Update AndroidManifest (Permissions & App Name)
          manifest = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest):
              with open(manifest, 'r') as f: m = f.read()
              m = re.sub(r'android:label=\"[^\"]+\"', 'android:label=\"Kaida Dub\"', m)
              perms = '    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" />\n    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" />\n    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n    <uses-permission android:name=\"android.permission.INTERNET\" />\n'
              if 'RECORD_AUDIO' not in m:
                  m = m.replace('<application', perms + '    <application')
              with open(manifest, 'w') as f: f.write(m)

          # 2. Force FFmpeg 'audio' package (Massive Size Reduction)
          root_kts = 'android/build.gradle.kts'
          root_groovy = 'android/build.gradle'
          if os.path.exists(root_kts):
              with open(root_kts, 'a') as f: f.write('\next.set(\"ffmpegKitPackage\", \"audio\")\n')
          elif os.path.exists(root_groovy):
              with open(root_groovy, 'a') as f: f.write('\next { ffmpegKitPackage = \"audio\" }\n')

          # 3. Add Maven repo to settings
          settings_kts = 'android/settings.gradle.kts'
          settings_groovy = 'android/settings.gradle'
          if os.path.exists(settings_kts):
              with open(settings_kts, 'r') as f: s = f.read()
              if 'ffmpeg-kit' not in s:
                  s = s.replace('mavenCentral()', 'mavenCentral()\n        maven(\"https://raw.githubusercontent.com/DucLQ92/ffmpeg-kit-audio/main\")')
                  with open(settings_kts, 'w') as f: f.write(s)
          elif os.path.exists(settings_groovy):
              with open(settings_groovy, 'r') as f: s = f.read()
              if 'ffmpeg-kit' not in s:
                  s = s.replace('mavenCentral()', 'mavenCentral()\n        maven { url \"https://raw.githubusercontent.com/DucLQ92/ffmpeg-kit-audio/main\" }')
                  with open(settings_groovy, 'w') as f: f.write(s)

          # 4. ENABLE shrinker (R8) now that we have strong Proguard rules
          build_kts = 'android/app/build.gradle.kts'
          build_groovy = 'android/app/build.gradle'
          if os.path.exists(build_kts):
              with open(build_kts, 'r') as f: b = f.read()
              b = b.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
              b = b.replace('namespace = \"com.example.dubapp\"', 'namespace = \"com.kainuwa.dubapp\"')
              b = b.replace('applicationId = \"com.example.dubapp\"', 'applicationId = \"com.kainuwa.dubapp\"')
              if 'proguardFiles' not in b:
                  b = b.replace('release {', 'release {\n            isMinifyEnabled = true\n            isShrinkResources = true\n            proguardFiles(getDefaultProguardFile(\"proguard-android-optimize.txt\"), \"proguard-rules.pro\")')
              with open(build_kts, 'w') as f: f.write(b)
          elif os.path.exists(build_groovy):
              with open(build_groovy, 'r') as f: b = f.read()
              b = b.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 24')
              b = b.replace('namespace \"com.example.dubapp\"', 'namespace \"com.kainuwa.dubapp\"')
              b = b.replace('applicationId \"com.example.dubapp\"', 'applicationId \"com.kainuwa.dubapp\"')
              if 'proguardFiles' not in b:
                  b = b.replace('release {', 'release {\n            minifyEnabled true\n            shrinkResources true\n            proguardFiles getDefaultProguardFile(\"proguard-android-optimize.txt\"), \"proguard-rules.pro\"')
              with open(build_groovy, 'w') as f: f.write(b)
          "

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode --ignore-garbage > android/app/upload-keystore.jks
          cat << 'EOF' > android/key.properties
          storePassword=kaidadub2026
          keyPassword=kaidadub2026
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF
          
      - name: Build Split APKs (For direct phone install)
        run: flutter build apk --release --split-per-abi
        
      - name: Build AAB (For Google Play Store)
        run: flutter build appbundle --release
        
      - name: Upload Clean Optimized Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kaida-Dub-Production-Build
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/bundle/release/app-release.aab
